}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function home(){app.innerHTML=`<section class="hero"><h1>ابدئي ببرنامجك… ودعي المكتبة تقودك إلى القياس المناسب</h1><p>اختاري موضوع البرنامج بلغة مدرسية بسيطة، وسنقترح لكِ مسار القياس والأداة المناسبة دون الحاجة إلى معرفة مصطلحات القياس.</p><div class="journey"><span>موضوع البرنامج</span><b>←</b><span>ما الذي تريدين قياسه؟</span><b>←</b><span>الأداة المناسبة</span></div><p class="journey-note">لن نسألك إلا عما نحتاجه لبناء أداة مناسبة.</p><button class="primary" onclick="start()">إنشاء أداة قياس</button></section>`}
function start(){Object.assign(S,{step:1,topic:'',outcome:'',mode:'',programTitle:'',audience:'طالبات',stage:'ثانوي',grades:['الأول'],count:7,timing:'بعدي',source:'',items:[]});render()}
function prog(){return `<div class="progress">${[1,2,3].map(n=>`<span class="dot ${S.step>=n?'on':''}"></span>`).join('')}</div>`}
function crumbs(){let a=[];if(S.topic)a.push(S.topic);if(S.programTitle)a.push(S.programTitle);if(S.outcome)a.push(S.outcome);return a.length?`<div style="color:var(--muted);font-size:13px;margin-bottom:14px">${a.map(esc).join(' ← ')}</div>`:''}
function render(){if(S.step===1)return stepTopic();if(S.step===2)return stepOutcome();if(S.step===3)return stepSetup();if(S.step===4)return editor()}
function selectTopic(k){if(S.topic!==k){S.topic=k;S.outcome='';S.mode='';S.programTitle='';S.source='';S.items=[];S.recommendation='';S.title='';S.goal='';S.scale='';}S.step=2;render()}
function selectOutcome(x,m){if(S.outcome!==x){S.outcome=x;S.mode=m;S.programTitle='';S.source='';S.items=[];S.recommendation='';S.title='';S.goal='';S.scale='';}S.step=3;render()}
function stepTopic(){app.innerHTML=`<section class="panel">${prog()}<h2>ما موضوع البرنامج أو المبادرة؟</h2><p class="lead">اختاري الباب الأقرب. سنسألك بعده فقط عما نحتاجه فعلًا لبناء القياس.</p><div class="grid">${Object.entries(TOPICS).map(([k,v])=>`<div class="card ${S.topic===k?'sel':''}" onclick="selectTopic('${k}')"><h3>${k}</h3><p>${v.desc}</p></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="home()">رجوع</button></div></section>`}
function stepOutcome(){const t=TOPICS[S.topic];app.innerHTML=`<section class="panel">${prog()}${crumbs()}<h2>ما الذي تريدين قياسه؟</h2><p class="lead">اختاري النتيجة الأقرب لهدف برنامجك. نحن سنحدد الأداة في الخلفية.</p><div class="grid">${t.outcomes.map(([x,d,m])=>`<div class="card" onclick="selectOutcome('${x}','${m}')"><h3>${x}</h3><p>${d}</p></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="S.step=1;render()">رجوع</button></div></section>`}
function needsContent(){const r=currentRule();return !r||r.requiresContent}
function toolFor(){const r=currentRule();return r?r.tool:'غير محدد'}
function stageButtons(){return `<div class="field"><label>الفئة المستهدفة</label><div class="countrow">${['طالبات','معلمات','أولياء أمور','أخرى'].map(x=>`<button class="count ${S.audience===x?'sel':''}" onclick="S.audience='${x}';render()">${x}</button>`).join('')}</div></div>${S.audience==='طالبات'?`<div class="field"><label>المرحلة</label><div class="countrow">${['ابتدائي','متوسط','ثانوي','المدرسة'].map(x=>`<button class="count ${S.stage===x?'sel':''}" onclick="S.stage='${x}';S.grades=[];render()">${x==='المدرسة'?'جميع طالبات المدرسة':x}</button>`).join('')}</div></div>${S.stage!=='المدرسة'?`<div class="field"><label>الصفوف المستهدفة</label><div class="countrow">${(S.stage==='ابتدائي'?['الأول','الثاني','الثالث','الرابع','الخامس','السادس']:['الأول','الثاني','الثالث']).map(g=>`<button class="count ${S.grades.includes(g)?'sel':''}" onclick="toggleGrade('${g}')">${g}</button>`).join('')}</div></div>`:''}`:''}`}
function toggleGrade(g){S.grades=S.grades.includes(g)?S.grades.filter(x=>x!==g):[...S.grades,g];render()}
function stepSetup(){S.recommendation=toolFor();const req=needsContent();app.innerHTML=`<section class="panel">${prog()}${crumbs()}<h2>${req?'نحتاج معلومة واحدة قبل بناء الأداة':'يمكننا بناء الأداة مباشرة'}</h2><p class="lead">${req?'هذا النوع يعتمد على محتوى البرنامج؛ لذلك لن نخمن أسئلة لا نعرف إجابتها.':'هذا النوع لا يحتاج منك كتابة محتوى. سنستخدم بنك فقرات أوليًا معدًا مسبقًا وقابلًا للتعديل، ويحتاج اعتمادًا/تحكيمًا قبل الاستخدام الرسمي.'}</p><div class="notice"><strong>الأداة المقترحة: ${S.recommendation}</strong><br>${req?'سنطلب المحتوى فقط لأن صحة الفقرات تعتمد عليه.':'يمكن إعداد مسودة فقرات عامة من هدف القياس والفئة المستهدفة، ثم مراجعتها واعتمادها قبل التطبيق الرسمي.'}</div><div class="field"><label>اسم البرنامج أو موضوعه</label><input value="${esc(S.programTitle)}" oninput="S.programTitle=this.value;updateCreate()" placeholder="مثال: تعزيز الدافعية للتعلم، الأمن السيبراني، الانضباط"></div><div id="routeWarn" class="notice" style="display:${routeWarning()?'block':'none'};border-right-color:#a66b2d;background:#fbf6ef">${esc(routeWarning())}</div>${req?`<div class="field"><label>المحتوى أو المصدر الذي ستُبنى عليه الأسئلة</label><textarea rows="5" oninput="S.source=this.value;updateCreate()" placeholder="الصقي هنا النقاط المعتمدة أو أسئلة موثوقة أو محتوى البرنامج. لن نحول عناوين عامة إلى أسئلة علمية من عندنا.">${esc(S.source)}</textarea><small style="color:var(--muted)">إذا توفر لاحقًا بنك أسئلة موثوق للموضوع، يمكن تجاوز هذه الخطوة.</small></div>`:''}${stageButtons()}<div class="field"><label>عدد الفقرات</label><div class="countrow">${[5,7,10,15].map(n=>`<button class="count ${S.count===n?'sel':''}" onclick="S.count=${n};render()">${n}</button>`).join('')}</div></div><details><summary style="cursor:pointer;font-weight:700;color:var(--brand)">خيارات إضافية</summary><div class="field"><label>توقيت القياس</label><select onchange="S.timing=this.value">${['بعدي','قبلي','قبلي وبعدي','مرحلي'].map(x=>`<option ${S.timing===x?'selected':''}>${x}</option>`).join('')}</select>${S.timing==='قبلي وبعدي'?'<small style="color:var(--muted)">المقارنة القبلية/البعدية تصف التغير لدى المجموعة، ولا تثبت وحدها أن البرنامج هو السبب الوحيد للتغير.</small>':''}</div></details><div class="actions"><button class="secondary" onclick="S.step=2;render()">رجوع</button><button id="createBtn" class="primary" ${canCreate()?'':'disabled'} onclick="createTool()">${req?'متابعة لبناء الأداة':'إنشاء الأداة'}</button></div></section>`}
function canCreate(){return routeIsValid() && !!S.programTitle.trim() && (!needsContent()||!!S.source.trim()) && (S.audience!=='طالبات'||S.stage==='المدرسة'||S.grades.length>0)}
function updateCreate(){const b=document.getElementById('createBtn');if(b)b.disabled=!canCreate();const w=document.getElementById('routeWarn');if(w){const m=routeWarning();w.textContent=m;w.style.display=m?'block':'none'}}
function adaptItem(x){if(S.audience==='طالبات')return x;return x.replace(/الطالبة/g,'المستفيد').replace(/الطالبات/g,'المستفيدين')}
function createTool(){const r=currentRule();if(!r||!routeIsValid()){alert('تعذر بناء الأداة لأن مسار القياس غير مكتمل. عودي خطوة واختاري الهدف من جديد.');return}S.recommendation=r.tool;S.scale=r.scale;if(r.requiresContent){S.items=[];S.title=`أداة قياس: ${S.programTitle}`;S.goal=`قياس ${S.outcome} في ${S.programTitle}`;S.step=4;render();return}const bank=BANKS[r.bank];S.items=Array.from({length:S.count},(_,i)=>adaptItem(bank[i%bank.length]));S.title=`أداة قياس: ${S.programTitle}`;S.goal=`قياس ${S.outcome} لدى ${S.audience} في ${S.programTitle}.`;S.step=4;render()}
function editor(){const req=needsContent();app.innerHTML=`<section class="panel">${crumbs()}<h2>${req?'المحتوى محفوظ — لا توجد أسئلة مختلقة':'مسودة الأداة جاهزة للمراجعة'}</h2><p class="lead">${req?'هذا المسار يحتاج بنكًا متخصصًا أو أسئلة صحيحة من المصدر. لن ننشئ صياغات علمية عامة ونقدمها كاختبار جاهز.':'راجعي الفقرات واعتمدي صياغتها قبل التطبيق، ثم احفظي الأداة في مكتبتك.'}</p><div class="notice"><strong>${S.recommendation}</strong>${req?'<br>يمكنك الآن إضافة الأسئلة الصحيحة من المصدر يدويًا، وسيبقى بناء الاختبار منظمًا داخل الأداة.':` · ${S.items.length} فقرات`}<br><span style="color:var(--muted)">طريقة الاستجابة: ${esc(S.scale||'تحدد حسب الأداة')}</span></div><div class="field"><label>عنوان الأداة</label><input id="title" value="${esc(S.title)}"></div><div class="field"><label>هدف القياس</label><textarea id="goal" rows="2">${esc(S.goal)}</textarea></div><h3>الفقرات</h3><div id="items">${S.items.length?S.items.map((x,i)=>itemHtml(x,i)).join(''):'<div class="empty">لم نولد أسئلة تلقائيًا لأن هذا القياس يعتمد على محتوى متخصص. أضيفي السؤال الصحيح من مصدرك.</div>'}</div><button class="secondary" onclick="addItem()">+ إضافة فقرة</button><div class="actions"><button class="secondary" onclick="S.step=3;render()">رجوع</button><button class="primary" onclick="saveTool()">حفظ في مكتبتي</button></div></section>`}
function itemHtml(x,i){return `<div class="item"><div class="itemhead"><strong>الفقرة ${i+1}</strong><button class="tiny" onclick="removeItem(${i})">حذف</button></div><div class="field"><textarea rows="2" onchange="S.items[${i}]=this.value">${esc(x)}</textarea></div></div>`}
function addItem(){S.items.push('');editor()}function removeItem(i){S.items.splice(i,1);editor()}
function saveTool(){S.title=document.getElementById('title').value;S.goal=document.getElementById('goal').value;const a=JSON.parse(localStorage.getItem('measurementToolsV2')||'[]');a.unshift({id:Date.now(),...JSON.parse(JSON.stringify(S)),savedAt:new Date().toLocaleDateString('ar-SA')});localStorage.setItem('measurementToolsV2',JSON.stringify(a));library(true)}
function library(saved=false){const a=JSON.parse(localStorage.getItem('measurementToolsV2')||'[]');app.innerHTML=`<section class="panel"><h2>مكتبتي</h2><p class="lead">الأدوات التي أعددتها وحفظتها على هذا الجهاز.</p>${saved?'<div class="notice">تم حفظ الأداة في مكتبتي.</div>':''}${a.length?a.map(t=>`<div class="library-card"><strong>${esc(t.title)}</strong><p class="lead" style="margin:5px 0">${esc(t.topic)} · ${esc(t.recommendation)} · ${t.items.length} فقرات · ${t.savedAt}</p><button class="secondary" onclick="openTool(${t.id})">فتح وتعديل</button> <button class="tiny" onclick="delTool(${t.id})">حذف</button></div>`).join(''):'<div class="empty">لا توجد أدوات محفوظة بعد.</div>'}</section>`}
function openTool(id){const t=JSON.parse(localStorage.getItem('measurementToolsV2')||'[]').find(x=>x.id===id);if(t){Object.assign(S,t,{step:4});editor()}}function delTool(id){let a=JSON.parse(localStorage.getItem('measurementToolsV2')||'[]').filter(x=>x.id!==id);localStorage.setItem('measurementToolsV2',JSON.stringify(a));library()}
function needImpact(){app.innerHTML=`<section class="panel"><h2>هل أحتاج قياس أثر؟</h2><p class="lead">ليس كل عمل مدرسي يحتاج أداة قياس مستقلة.</p><div class="notice"><strong>يكفي عادة توثيق التنفيذ</strong> في الأعمال التنظيمية مثل اجتماع أو إعلان أو تعميم أو نشر رابط أو تجهيز ركن؛ ما لم يكن للعمل ناتج محدد تريدين التحقق منه.</div><div style="height:15px"></div><div class="notice"><strong>استخدمي قياس أثر</strong> عندما يستهدف البرنامج تغيرًا مقصودًا في معرفة أو مهارة أو سلوك أو اتجاه، أو عندما يكون الرضا نفسه نتيجة مقصودة.</div><p class="lead" style="margin-top:20px">شواهد الإنجاز تثبت أن التنفيذ حدث. أداة القياس تعطي بيانات للحكم على النتيجة.</p><button class="primary" onclick="start()">إنشاء أداة قياس</button></section>`}
home();
</script></body></html>
